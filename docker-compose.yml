version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: approval_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: approval_db
      POSTGRES_USER: approval_user
      POSTGRES_PASSWORD: approval_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approval_user -d approval_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/approval-system
      dockerfile: Dockerfile
    container_name: approval_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/approval_db
      SPRING_DATASOURCE_USERNAME: approval_user
      SPRING_DATASOURCE_PASSWORD: approval_pass
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: approval_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
