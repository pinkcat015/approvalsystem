version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: approval_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: approval_db
      POSTGRES_USER: approval_user
      POSTGRES_PASSWORD: approval_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approval_user -d approval_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/approval-system
      dockerfile: Dockerfile
    container_name: approval_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/approval_db
      SPRING_DATASOURCE_USERNAME: approval_user
      SPRING_DATASOURCE_PASSWORD: approval_pass
      S3_URL: http://minio:9000
      S3_ACCESS_KEY: approval_admin
      S3_SECRET_KEY: approval_secret_123
      S3_BUCKET: approval-system-attachments
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: approval_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  minio:
    image: minio/minio:latest
    container_name: approval_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: approval_admin
      MINIO_ROOT_PASSWORD: approval_secret_123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    container_name: approval_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 approval_admin approval_secret_123;
      /usr/bin/mc mb myminio/approval-system-attachments --ignore-existing;
      /usr/bin/mc anonymous set public myminio/approval-system-attachments;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
